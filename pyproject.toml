[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "readico"
version = "0.1.0"
description = "RAG-based PDF document search and QA service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pypdf>=4.1.0",
    "langchain-text-splitters>=0.0.1",
    "python-multipart>=0.0.9",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "qdrant-client>=0.1.0",
    "openai>=2.53.0",
    "slowapi>=0.1.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
