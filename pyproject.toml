[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "readico"
version = "0.1.0"
description = "Scalable RAG Chatbot with streaming document parser and dynamic infrastructure configuration"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.1.0",
    "langchain>=0.1.12",
    "langchain-community>=0.0.28",
    "langchain-openai>=0.0.8",
    "faiss-cpu>=1.8.0",
    "tiktoken>=0.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]